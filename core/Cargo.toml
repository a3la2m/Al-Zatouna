[package]
name = "ec-core"
description = "Education Center Management System — core domain, database and data-directory layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
tempfile = { version = "3", optional = true }
argon2 = { workspace = true }
rand = { workspace = true }

[features]
test-utils = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
ec-core = { path = ".", features = ["test-utils"] }
